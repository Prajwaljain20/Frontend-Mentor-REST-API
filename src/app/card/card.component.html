<div class="card">
    <div class="flag" [ngStyle]="{'background' : image}"></div>
    <div class="details">
        <h3 [textContent]="cards.names.common"></h3>
        <h5>Population: <span [textContent]="cards.population"></span></h5>
        <h5>Region: <span [textContent]="cards.region"></span></h5>
        <h5 *ngIf='cards.capitals.length > 0'>Capital: <span [textContent]="cards.capitals[0].name"></span></h5>
    </div>
</div>
